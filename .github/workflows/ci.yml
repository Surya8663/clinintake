name: ClinIntake CI

on:
  push:
    branches: [ "main", "remediation/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff mypy
      - name: Ruff lint
        run: ruff check services/
      - name: Mypy type check
        run: |
          EXIT=0
          for svc in services/*/; do
            [ -d "${svc}src" ] || continue
            mypy "${svc}src" --ignore-missing-imports --no-strict-optional --explicit-package-bases || EXIT=$?
          done
          exit $EXIT

  unit-tests-backend:
    name: Unit Tests (Backend)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
      - name: Install system dependencies (Tesseract OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install pytest pytest-cov pytest-asyncio pydantic pydantic-settings fastapi httpx python-jose PyJWT python-multipart sqlalchemy aiosqlite python-json-logger cryptography filetype Pillow transitions qdrant-client pypdf aiokafka rapidfuzz fhir.resources python-dateutil pytesseract redis alembic
      - name: Run unit tests
        env:
          LYZR_API_KEY: "mock-ci-key-for-unit-tests"
          LLM_API_KEY: "mock-ci-key-for-unit-tests"
          JWT_SECRET_KEY: "mock-secret-key-for-unit-tests"
        run: |
          EXIT=0
          for svc in services/*/; do
            [ -d "${svc}tests" ] || continue
            echo "Running tests in ${svc}..."
            PYTHONPATH="${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}/${svc}:${GITHUB_WORKSPACE}/${svc}src:." pytest "${svc}tests" -v --tb=short --import-mode=importlib --asyncio-mode=auto || { STATUS=$?; echo "::error file=${svc}::Tests failed in ${svc} with exit code ${STATUS}"; EXIT=${STATUS}; }
          done
          exit $EXIT

  unit-tests-frontend:
    name: Unit Tests (Frontend)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and test Clinical Workspace
        run: |
          cd services/clinical-workspace/frontend
          npm ci
          npm run build

  container-integration-tests:
    name: Container Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests-backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: clinintake_test
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
          POSTGRES_DB: clinintake_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://clinintake_test:${{ secrets.TEST_POSTGRES_PASSWORD }}@localhost:5432/clinintake_test
      HMAC_SECRET_KEY: ${{ secrets.HMAC_SECRET_KEY }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      EHR_CLIENT_SECRET: ${{ secrets.EHR_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pytest pytest-asyncio httpx pydantic pydantic-settings fastapi sqlalchemy asyncpg python-jose
      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short

  security-secret-scan:
    name: Secret & Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar xz
          sudo mv gitleaks /usr/local/bin/
      - name: Run Gitleaks secret scan
        run: gitleaks detect --source . --config .gitleaks.toml --exit-code 1

  trivy-container-scan:
    name: Trivy Container Vulnerability Scan
    runs-on: ubuntu-latest
    needs: unit-tests-backend
    steps:
      - uses: actions/checkout@v4
      - name: Build audit-service image
        run: docker build -t clinintake/audit-service:ci services/audit-service/
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: clinintake/audit-service:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
