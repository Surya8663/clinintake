[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical_contracts"
version = "2.0.0"
description = "Authoritative Pydantic v2 shared API contracts for ClinIntake microservices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
