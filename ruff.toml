# ruff.toml — ClinIntake Suite linting configuration
# Python target: 3.12 (matches CI setup-python version)

target-version = "py312"
line-length = 200

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade (modernise syntax)
    "B",    # flake8-bugbear
    "RUF",  # ruff-specific rules
    "SIM",  # flake8-simplify
    "PIE",  # flake8-pie
    "TRY",  # tryceratops
    "BLE",  # blind exception
    "DTZ",  # datetime timezone
    "S",    # bandit security (subset)
    "C4",   # flake8-comprehensions
]

ignore = [
    # FastAPI Depends() in function default args — this is the canonical FastAPI pattern.
    # Ruff B008 flags Depends(get_db) etc. as function calls in defaults; suppressing globally.
    "B008",

    # Broad exception handlers: many services catch Exception for structured error responses.
    # These are intentional in production gateway/middleware code.
    "BLE001",

    # TRY201: Verbose raise inside except — acceptable for explicit error chaining.
    "TRY201",

    # DTZ — datetime without timezone: some services intentionally use naive datetimes for
    # internal audit timestamps stored as UTC by convention.
    "DTZ003",
    "DTZ005",
    "DTZ007",
    "DTZ011",

    # S110: try-except-pass — one intentional case in health-check probe.
    "S110",

    # RUF012: mutable class defaults — Pydantic models use ClassVar or Field() patterns.
    "RUF012",

    # SIM102: collapsible-if — left as-is for readability in nested conditions.
    "SIM102",

    # B006: mutable argument default — some services use [] default intentionally with guards.
    "B006",

    # RUF013: implicit optional — pydantic fields handled separately.
    "RUF013",

    # C414: unnecessary double-cast — leaving as-is.
    "C414",

    # SIM401: if-else block instead of dict.get — readability preference.
    "SIM401",

    # RUF059: unused unpacked variable — underscore convention varies across services.
    "RUF059",

    # F841: unused variable — some services intentionally bind for side effects.
    "F841",

    # E501: line-too-long — existing codebase has many long docstrings/comments.
    # Addressed by raising line-length to 200; any remaining are in comments only.
    "E501",

    # TRY003/300/301: raise style preferences — acceptable in healthcare service code.
    "TRY003",
    "TRY300",
    "TRY301",

    # B904: raise without from inside except — acceptable where error chain is irrelevant.
    "B904",

    # E402: module import not at top — test files set os.environ before imports (required).
    "E402",

    # E741: ambiguous variable name (l, O, I) — existing codebase uses these in math.
    "E741",

    # B007: unused loop control variable — intentional in some iteration patterns.
    "B007",

    # S105/S106: hardcoded password string/func-arg — test fixture dummy values only.
    # Real secrets are loaded from environment variables; these are clearly test-only.
    "S105",
    "S106",

    # S311: non-cryptographic random — used for jitter/backoff, not security.
    "S311",

    # S324: insecure hash function (MD5/SHA1) — used for non-security checksums only.
    "S324",

    # SIM108: if-else-block-instead-of-if-exp — readability preference.
    "SIM108",

    # RUF003: ambiguous unicode character in comment — existing comments.
    "RUF003",
]

[lint.isort]
known-first-party = ["services", "src"]
force-sort-within-sections = true

[lint.per-file-ignores]
# Test files: allow unused imports (pytest fixtures), broad asserts, and test-specific patterns
"tests/**/*.py" = ["F401", "S101", "BLE001"]
"**/tests/*.py" = ["F401", "S101", "BLE001"]
"**/test_*.py" = ["F401", "S101", "BLE001"]
