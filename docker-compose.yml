version: "3.8"
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: healthcare_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d healthcare_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
    ports:
      - "8081:8081"
      - "8082:8082"
      - "9092:9092"
      - "29092:29092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  hapi-fhir:
    image: hapiproject/hapi:latest
    ports:
      - "8080:8080"
    environment:
      - spring.datasource.url=jdbc:h2:file:./target/database/h2
    volumes:
      - hapi_data:/database

  clamav:
    image: clamav/clamav:latest
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 2 localhost 3310 | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  ocr-service:
    build:
      context: ./services/ocr-service
    ports:
      - "8004:8004"
    environment:
      - SERVICE_PORT=8004
      - LOG_LEVEL=INFO

  extraction-agent:
    build:
      context: ./services/extraction-agent
    ports:
      - "8002:8002"
    environment:
      - SERVICE_PORT=8002
      - OCR_SERVICE_URL=http://ocr-service:8004
      - CONFIDENCE_THRESHOLD=0.70
      - LOG_LEVEL=INFO

  terminology-service:
    build:
      context: ./services/terminology-service
    ports:
      - "8007:8007"
    environment:
      - SERVICE_PORT=8007
      - CONFIDENCE_THRESHOLD=0.65
      - LOG_LEVEL=INFO

  schema-validator:
    build:
      context: ./services/schema-validator
    ports:
      - "8003:8003"
    environment:
      - SERVICE_PORT=8003
      - LOG_LEVEL=INFO

  fhir-integration-service:
    build:
      context: ./services/fhir-integration-service
    ports:
      - "8006:8006"
    environment:
      - SERVICE_PORT=8006
      - EHR_CLIENT_SECRET=sec_kms_ehr_write_token_2026_x99
      - HAPI_FHIR_BASE_URL=http://hapi-fhir:8080/fhir
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=INFO

  clinical-rules-engine:
    build:
      context: ./services/clinical-rules-engine
    ports:
      - "8008:8008"
    environment:
      - SERVICE_PORT=8008
      - LOG_LEVEL=INFO

  temporal-reasoning-engine:
    build:
      context: ./services/temporal-reasoning-engine
    ports:
      - "8009:8009"
    environment:
      - SERVICE_PORT=8009
      - LOG_LEVEL=INFO

  drug-interaction-service:
    build:
      context: ./services/drug-interaction-service
    ports:
      - "8010:8010"
    environment:
      - SERVICE_PORT=8010
      - LOG_LEVEL=INFO

  guideline-retrieval-service:
    build:
      context: ./services/guideline-retrieval-service
    ports:
      - "8011:8011"
    environment:
      - SERVICE_PORT=8011
      - QDRANT_URL=http://qdrant:6333
      - RELEVANCE_THRESHOLD=0.60
      - LOG_LEVEL=INFO

  safety-sub-agent:
    build:
      context: ./services/safety-sub-agent
    ports:
      - "8005:8005"
    environment:
      - SERVICE_PORT=8005
      - LOG_LEVEL=INFO

  audit-service:
    build:
      context: ./services/audit-service
    ports:
      - "8012:8012"
    environment:
      - SERVICE_PORT=8012
      - HMAC_SECRET_KEY=clinintake_kms_master_audit_secret_key_2026
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - LOG_LEVEL=INFO

  care-gap-explanation-agent:
    build:
      context: ./services/care-gap-explanation-agent
    ports:
      - "8013:8013"
    environment:
      - SERVICE_PORT=8013
      - LOG_LEVEL=INFO

  referral-drafting-agent:
    build:
      context: ./services/referral-drafting-agent
    ports:
      - "8014:8014"
    environment:
      - SERVICE_PORT=8014
      - LOG_LEVEL=INFO

  clinical-workspace:
    build:
      context: ./services/clinical-workspace
    ports:
      - "8015:8015"
    environment:
      - SERVICE_PORT=8015
      - LOG_LEVEL=INFO

  failure-queue-service:
    build:
      context: ./services/failure-queue-service
    ports:
      - "8016:8016"
    environment:
      - SERVICE_PORT=8016
      - MAX_RETRIES=3
      - LOG_LEVEL=INFO

  notification-system:
    build:
      context: ./services/notification-system
    ports:
      - "8017:8017"
    environment:
      - SERVICE_PORT=8017
      - SLA_LATENCY_THRESHOLD_MS=2000.0
      - LOG_LEVEL=INFO

  iam-service:
    build:
      context: ./services/iam-service
    ports:
      - "8018:8018"
    environment:
      - SERVICE_PORT=8018
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - LOG_LEVEL=INFO

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  redpanda_data:
  hapi_data:
  clamav_data:
