repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
        files: \.json$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.2
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: no-runtime-fakes
        name: Verify no mock/fake/dummy terms in runtime code
        entry: python scripts/quality/scan_forbidden_terms.py
        language: system
        pass_filenames: false
        always_run: true

      - id: eslint-clinical-workspace
        name: eslint (clinical-workspace)
        entry: npm run lint
        language: system
        pass_filenames: false
        always_run: true
        files: ^services/clinical-workspace/frontend/

      - id: eslint-compliance-dashboard
        name: eslint (compliance-dashboard)
        entry: npm run lint
        language: system
        pass_filenames: false
        always_run: true
        files: ^services/compliance-dashboard/frontend/

      - id: eslint-metrics-dashboard
        name: eslint (metrics-dashboard)
        entry: npm run lint
        language: system
        pass_filenames: false
        always_run: true
        files: ^services/metrics-dashboard/frontend/
